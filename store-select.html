<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お店から選ぶ | ペイ択（PayTaku）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1120; --card:#1E293B; --border:#334155; --primary:#3B82F6;
    --accent:#F87171; --tag-bg:#1E3A8A; --tag-text:#BFDBFE; --text:#F9FAFB; --muted:#94A3B8;
  }
  *{box-sizing:border-box;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  .app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:80px;}
  .masthead{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20;}
  .logo-wrap{display:flex;align-items:center;gap:8px;}
  .logo-mark{width:26px;height:26px;color:var(--primary);}
  .logo-text{font-weight:900;font-size:17px;letter-spacing:.01em;}
  .head-actions{display:flex;align-items:center;gap:18px;}
  .head-icon{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text);font-size:10px;}
  .head-icon svg{width:20px;height:20px;}
  .title-area{padding:20px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;}
  .page-title{font-size:20px;font-weight:700;margin:0;}
  .sub-copy{font-size:12px;color:var(--muted);margin-top:4px;}
  .guide-link{font-size:12px;color:var(--primary);white-space:nowrap;display:flex;align-items:center;gap:3px;}
  .search-area{display:flex;gap:8px;padding:16px 16px 0;}
  .search-bar{flex:1;height:48px;background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted);}
  .search-bar input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
  .search-bar input::placeholder{color:var(--muted);}
  .filter-btn{height:48px;padding:0 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;color:var(--text);}
  .chips-row{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 0;scrollbar-width:none;}
  .chips-row::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--muted);font-size:10px;min-width:56px;text-align:center;white-space:nowrap;}
  .chip svg{width:16px;height:16px;margin-bottom:2px;}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .filter-sort{display:flex;gap:12px;padding:16px 16px 0;}
  .dropdown{flex:1;height:44px;background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;color:var(--text);}
  .dropdown select{background:transparent;border:none;color:var(--text);font-size:13px;width:100%;appearance:none;outline:none;}
  .dropdown svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto;}
  .update-note{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0;font-size:11px;color:var(--muted);gap:8px;}
  .update-note .left{display:flex;align-items:center;gap:6px;}
  .result-count{padding:8px 16px 0;font-size:12px;color:var(--muted);}
  .store-list{padding:12px 16px 0;display:flex;flex-direction:column;gap:12px;}
  .store-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .store-top{display:flex;align-items:flex-start;gap:12px;}
  .store-icon{width:48px;height:48px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;}
  .store-icon svg{width:22px;height:22px;}
  .store-mid{flex:1;min-width:0;}
  .badge-osusume{display:inline-block;background:var(--tag-bg);color:var(--tag-text);font-size:10px;padding:2px 8px;border-radius:4px;margin-bottom:4px;}
  .store-name{font-size:16px;font-weight:700;line-height:1.3;}
  .store-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}
  .store-right{text-align:right;flex:0 0 auto;}
  .rate-label-top{font-size:11px;color:var(--muted);}
  .rate-num{font-size:26px;font-weight:700;color:var(--accent);line-height:1.1;}
  .rate-num span{font-size:13px;font-weight:500;}
  .rate-label-bottom{font-size:11px;color:var(--muted);}
  .heart{color:var(--muted);cursor:pointer;}
  .tag-area{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .tag{background:var(--tag-bg);color:var(--tag-text);font-size:11px;padding:4px 8px;border-radius:4px;}
  .tag.more{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .route-box{margin-top:12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .route-box .label{font-size:10px;color:var(--muted);margin-bottom:2px;}
  .route-box .route{font-size:12px;color:var(--text);}
  .route-box svg{flex:0 0 auto;color:var(--muted);transition:transform .2s;}
  .store-card.open .route-box svg{transform:rotate(90deg);}
  .card-detail{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .store-card.open .card-detail{max-height:1200px;}
  .card-detail-inner{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .card-row{border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .card-row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .card-row-name{font-size:12px;font-weight:700;}
  .card-row-rate{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap;}
  .card-row-method{font-size:11px;color:var(--muted);margin-top:4px;}
  .cta-btn{width:100%;height:44px;margin-top:12px;border-radius:8px;border:none;color:#fff;font-size:14px;font-weight:700;background:linear-gradient(135deg,#3B82F6 0%,#6366F1 100%);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
  .safety{margin:16px 16px 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;}
  .safety-icon{color:var(--primary);flex:0 0 auto;}
  .safety-text{flex:1;font-size:11px;color:var(--muted);line-height:1.5;}
  .safety-text b{color:var(--text);font-size:12px;display:block;margin-bottom:2px;font-weight:700;}
  .safety-btn{font-size:11px;background:var(--primary);color:#fff;padding:8px 12px;border-radius:6px;white-space:nowrap;display:flex;align-items:center;gap:2px;}
  .empty-note{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:64px;background:#0F172A;border-top:1px solid var(--border);display:flex;z-index:30;}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;}
  .nav-item svg{width:20px;height:20px;}
  .nav-item.active{color:var(--primary);}
</style>
</head>
<body>
<div class="app">

  <header class="masthead">
    <div class="logo-wrap">

</div>

<script>

  const path = CATEGORY_ICONS[cat] || CATEGORY_ICONS["その他"];
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${path}</svg>`;
}

// カテゴリ一覧（データに実在するものだけ、店舗数の多い順）
const catCounts = {};
STORES.forEach(s => catCounts[s.category] = (catCounts[s.category]||0) + 1);
const CATEGORIES = ["すべて", ...Object.keys(catCounts).sort((a,b)=>catCounts[b]-catCounts[a])];

function extractMaxRate(rateStr){
  if(!rateStr) return null;
  const matches = [...rateStr.matchAll(/(\d+(?:\.\d+)?)\s*[%％]/g)].map(m=>parseFloat(m[1]));
  if(!matches.length) return null;
  return Math.max(...matches);
}
function bestCard(store){
  let best = null, bestVal = -1;
  (store.cards||[]).forEach(c=>{
    const v = extractMaxRate(c.rate);
    if(v !== null && v > bestVal){ bestVal = v; best = c; }
  });
  if(!best && store.cards && store.cards.length) best = store.cards[0];
  return { card: best, value: bestVal >= 0 ? bestVal : null };
}

let currentCat = "すべて";
let currentSort = "rate";
let currentQuery = "";

function renderChips(){
  const wrap = document.getElementById('chipsRow');
  wrap.innerHTML = CATEGORIES.map(c => `
    <button class="chip ${c===currentCat?'active':''}" data-cat="${c}">
      ${iconSvg(c)}
      ${c}
    </button>
  `).join('');
}

function matchesQuery(store, q){
  if(!q) return true;
  const hay = (store.name + " " + store.category + " " + (store.cards||[]).map(c=>c.name+" "+c.method).join(" ")).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function getFiltered(){
  let list = STORES.filter(s => (currentCat === "すべて" || s.category === currentCat) && matchesQuery(s, currentQuery));
  list = list.map(s => ({ store: s, best: bestCard(s) }));
  if(currentSort === "rate"){
    list.sort((a,b)=> (b.best.value ?? -1) - (a.best.value ?? -1));
  } else if(currentSort === "name"){
    list.sort((a,b)=> a.store.name.localeCompare(b.store.name, 'ja'));
  } else if(currentSort === "cards"){
    list.sort((a,b)=> (b.store.cards||[]).length - (a.store.cards||[]).length);
  }
  return list;
}

function formatRate(rateStr, value){
  const isOff = /OFF/i.test(rateStr||"");
  const isMax = /最大/.test(rateStr||"");
  const label = isMax ? "最大" : "還元率";
  const unit = isOff ? "%OFF" : "%";
  const num = value !== null ? value : "-";
  return { label, num, unit };
}

function renderList(){
  const listEl = document.getElementById('storeList');
  const countEl = document.getElementById('resultCount');
  const filtered = getFiltered();
  countEl.textContent = `${filtered.length}件のお店を表示中（全${STORES.length}店舗）`;

  if(!filtered.length){
    listEl.innerHTML = `<div class="empty-note">条件に一致するお店が見つかりませんでした。<br>キーワードやカテゴリを変えてお試しください。</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(({store, best}, idx) => {
    const r = formatRate(best.card ? best.card.rate : "", best.value);
    const tags = (store.cards||[]).slice(0,3).map(c=>`<span class="tag">${c.name}</span>`).join('');
    const moreCount = (store.cards||[]).length - 3;
    const moreTag = moreCount > 0 ? `<span class="tag more">+${moreCount}</span>` : '';
    const method = best.card ? best.card.method : '';
    const detailRows = (store.cards||[]).map(c => `
      <div class="card-row">
        <div class="card-row-top">
          <span class="card-row-name">${c.name}</span>
          <span class="card-row-rate">${c.rate}</span>
        </div>
        <div class="card-row-method">${c.method}</div>
      </div>
    `).join('');
    return `
    <div class="store-card" data-idx="${idx}">
      <div class="store-top">
        <div class="store-icon">${iconSvg(store.category)}</div>
        <div class="store-mid">
          <div class="store-name">${store.name}</div>
          <div class="store-sub">${store.category} ・ カード${ (store.cards||[]).length }件掲載</div>
        </div>
        <div class="store-right">
          <svg class="heart" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          <div class="rate-label-top">${r.label}</div>
          <div class="rate-num">${r.num}<span>${r.unit}</span></div>
          <div class="rate-label-bottom">ポイント還元</div>
        </div>
      </div>
      <div class="tag-area">${tags}${moreTag}</div>
      <div class="route-box js-toggle">
        <div>
          <div class="label">対応決済（一番お得なカード）</div>
          <div class="route">${method}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="card-detail"><div class="card-detail-inner">${detailRows}</div></div>
      <button class="cta-btn">このお店を比較する
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.js-toggle').forEach(el=>{
    el.addEventListener('click', ()=> el.closest('.store-card').classList.toggle('open'));
  });
}

document.getElementById('chipsRow').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  currentCat = chip.dataset.cat;
  renderChips();
  renderList();
});
document.getElementById('sortSelect').addEventListener('change', (e)=>{
  currentSort = e.target.value;
  renderList();
});
document.getElementById('searchInput').addEventListener('input', (e)=>{
  currentQuery = e.target.value;
  renderList();
});

renderChips();
renderList();
</script>
</body>
</html>
